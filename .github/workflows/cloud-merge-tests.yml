name: Cloud merge regression tests

on:
  pull_request:
    branches:
      - v2
    paths:
      - 'js/cloud-merge.js'
      - 'tests/cloud-merge.test.mjs'
      - '.github/workflows/cloud-merge-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-merge-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run cloud merge regression tests
        run: node --test tests/cloud-merge.test.mjs
