name: KAJO V2 CI

on:
  push:
    branches: [v2, feat/garmin-data-quality-v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

jobs:
  regression-smoke:
    # Eigene Pushes auf beiden Entwicklungsbranches laufen lokal.
    # Pull Requests bleiben auf GitHub-hosted Runnern (Sicherheit).
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/feat/garmin-data-quality-v2') && 'self-hosted' || 'ubuntu-24.04' }}
    defaults:
      run:
        # Windows nutzt cmd.exe, damit die lokale PowerShell-Execution-Policy nicht blockiert.
        # Pull Requests laufen auf Ubuntu und verwenden bash.
        shell: ${{ github.event_name == 'push' && 'cmd' || 'bash' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check js/storage.js && node --check js/user-storage.js && node --check js/local-db.js && node --check js/garmin-cloud-telemetry.js && node --check js/daily-heart-rate.js && node --check js/daily-hr-activity.js && node --check js/main.js && node --check js/analysis-insights.js && node --check js/calculations.js && node --check js/training-load.js && node --check js/data-source.js && node --check js/coach.js && node --check js/profile.js && node --check js/settings.js && node --check js/theme.js && node --check js/calendar.js && node --check js/activity-groups.js && node --check js/dashboard.js && node --check js/charts.js && node --check js/analysis-ui.js && node --check js/training-load-view.js && node --check js/analysis-overview.js && node --check js/activities.js && node --check js/import.js && node --check js/garmin-export-archive.js
      - name: Run regression smoke tests
        run: node tests/regression-smoke.mjs
      - name: Run Garmin load and coverage tests
        run: node --experimental-default-type=module --test tests/training-load.test.mjs
      - name: Run training load chart zone tests
        run: node --experimental-default-type=module --test tests/training-load-zones.test.mjs
      - name: Run daily Garmin HR recovery tests
        run: node --experimental-default-type=module --test tests/daily-heart-rate.test.mjs
      - name: Run navigation smoke tests
        run: node tests/navigation-smoke.mjs

  deploy-cloudflare:
    needs: regression-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Deploy KAJO to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.162.0"
          command: deploy
