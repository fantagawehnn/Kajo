name: KAJO V2 CI

on:
  push:
    branches: [v2, feat/garmin-data-quality-v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

jobs:
  regression-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check js/main.js && node --check js/analysis-insights.js && node --check js/calculations.js && node --check js/training-load.js && node --check js/data-source.js && node --check js/coach.js && node --check js/profile.js && node --check js/theme.js && node --check js/calendar.js && node --check js/dashboard.js && node --check js/charts.js && node --check js/analysis-ui.js && node --check js/activities.js && node --check js/import.js
      - name: Run navigation smoke tests
        run: node tests/navigation-smoke.mjs
      - name: Run regression smoke tests
        run: node tests/regression-smoke.mjs
      - name: Run Garmin load and coverage tests
        run: node --experimental-default-type=module --test tests/training-load.test.mjs
