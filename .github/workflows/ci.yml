
name: KAJO V2 CI

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2

permissions:
  contents: read

jobs:
  regression-smoke:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check js/storage.js
          node --check js/cloud-activities.js
          node --check js/activity-deletions.js
          node --check js/cloud-sync.js
          node --check js/user-storage.js
          node --check js/local-db.js
          node --check js/garmin-cloud-telemetry.js
          node --check js/garmin-analysis-cache.js
          node --check js/garmin-heart-rate-sync.js
          node --check js/daily-heart-rate.js
          node --check js/daily-hr-activity.js
          node --check js/strength-database.js
          node --check js/strength.js
          node --check js/main.js
          node --check js/auth.js
          node --check js/activation-ui-state.js
          node --check js/garmin-sync-history.js
          node --check js/analysis-insights.js
          node --check js/calculations.js
          node --check js/training-load.js
          node --check js/data-source.js
          node --check js/coach.js
          node --check js/coach-context.js
          node --check js/coach-data-context.js
          node --check js/coach-analysis.js
          node --check js/coach-decision-guidance.js
          node --check js/season-planning.js
          node --check js/adaptive-week-review.js
          node --check js/season-plan-editor.js
          node --check worker.js
          node --check js/profile.js
          node --check js/settings.js
          node --check js/theme.js
          node --check js/calendar.js
          node --check js/planning.js
          node --check js/planned-strength.js
          node --check js/activity-groups.js
          node --check js/dashboard.js
          node --check js/metric-zones.js
          node --check js/readiness.js
          node --check js/charts.js
          node --check js/garmin-metric-access.js
          node --check js/performance-data-quality.js
          node --check js/health-data.js
          node --check js/analysis-ui.js
          node --check js/training-load-view.js
          node --check js/analysis-overview.js
          node --check js/period-summary.js
          node --check js/garmin-performance-archive.js
          node --check js/activities.js
          node --check js/import.js
          node --check js/garmin-export-archive.js
          node --check js/garmin-export-import-core.js
          node --check js/garmin-export-import.js
          node --check supabase/functions/garmin-personal/activity-date.js
          node --check supabase/functions/garmin-personal/activity-scan-plan.js
          node --check supabase/functions/garmin-personal/automatic-sync-plan.js
          node --check supabase/functions/garmin-personal/fit-download-retry.js

      - name: Run automatic strength database tests
        run: node --experimental-default-type=module --test tests/strength-database.test.mjs

      - name: Run regression smoke tests
        run: node tests/regression-smoke.mjs

      - name: Run activation UI state tests
        run: node --experimental-default-type=module --test tests/activation-ui-state.test.mjs

      - name: Run Supabase auth bootstrap tests
        run: node --experimental-default-type=module --test tests/auth-session-bootstrap.test.mjs

      - name: Run account storage activation race tests
        run: node --experimental-default-type=module --test tests/storage-activation-race.test.mjs

      - name: Run async activation race tests
        run: node --experimental-default-type=module --test tests/async-activation-race.test.mjs

      - name: Run activity deletion tombstone tests
        run: node --experimental-default-type=module --test tests/activity-deletions.test.mjs tests/cloud-activities-tombstone.test.mjs

      - name: Run split cloud activity storage tests
        run: node --experimental-default-type=module --test tests/cloud-activities.test.mjs
      - name: Run parallel cloud activity loading tests
        run: node --experimental-default-type=module --test tests/cloud-activities-pagination.test.mjs

      - name: Run conflict-aware cloud merge tests
        run: node --experimental-default-type=module --test tests/cloud-merge.test.mjs

      - name: Run cloud snapshot patch tests
        run: node --experimental-default-type=module --test tests/cloud-sync-patch.test.mjs

      - name: Run cloud sync migration safety tests
        run: node --experimental-default-type=module --test tests/cloud-sync-migrations.test.mjs

      - name: Run season planning tests
        run: node --experimental-default-type=module --test tests/season-planning.test.mjs

      - name: Run season periodization proposal tests
        run: node --experimental-default-type=module --test tests/season-plan-proposal-worker.test.mjs

      - name: Run weekly plan proposal tests
        run: node --experimental-default-type=module --test tests/weekly-plan-proposal-worker.test.mjs

      - name: Run weekly plan calendar tests
        run: node --experimental-default-type=module --test tests/weekly-plan-calendar.test.mjs

      - name: Run planned strength exercise tests
        run: node --experimental-default-type=module --test tests/planned-strength.test.mjs

      - name: Run planned workout validation tests
        run: node --experimental-default-type=module --test tests/planned-workout-validation.test.mjs

      - name: Run adaptive weekly review tests
        run: node --experimental-default-type=module --test tests/adaptive-week-review.test.mjs

      - name: Run adaptive weekly adjustment Worker tests
        run: node --experimental-default-type=module --test tests/adaptive-week-adjustment-worker.test.mjs

      - name: Run Coach context regression tests
        run: node --experimental-default-type=module --test tests/coach-context.test.mjs

      - name: Run Coach decision guidance tests
        run: node --experimental-default-type=module --test tests/coach-decision-guidance.test.mjs

      - name: Run Coach decision Worker tests
        run: node --experimental-default-type=module --test tests/coach-decision-worker.test.mjs

      - name: Run Coach Worker security tests
        run: node --experimental-default-type=module --test tests/coach-worker.test.mjs

      - name: Run Garmin load and coverage tests
        run: node --experimental-default-type=module --test tests/training-load.test.mjs

      - name: Run CTL ATL TSB timeline reference tests
        run: node --experimental-default-type=module --test tests/training-load-timeline.test.mjs

      - name: Run training load chart zone tests
        run: node --experimental-default-type=module --test tests/training-load-zones.test.mjs

      - name: Run readiness and training recommendation tests
        run: node --experimental-default-type=module --test tests/readiness.test.mjs

      - name: Run five-zone metric classification tests
        run: node --experimental-default-type=module --test tests/metric-zones.test.mjs

      - name: Run period summary tests
        run: node --experimental-default-type=module --test tests/period-summary.test.mjs

      - name: Run Garmin VO2max archive tests
        run: node --experimental-default-type=module --test tests/garmin-performance-archive.test.mjs

      - name: Run Garmin full export import tests
        run: node --experimental-default-type=module --test tests/garmin-export-import.test.mjs

      - name: Run Garmin activity date parsing tests
        run: node --experimental-default-type=module --test tests/garmin-activity-date.test.mjs

      - name: Run Garmin sync lock wiring tests
        run: node --experimental-default-type=module --test tests/garmin-sync-lock-wiring.test.mjs

      - name: Run Garmin cloud fallback tests
        run: node --experimental-default-type=module --test tests/garmin-cloud-fallback.test.mjs

      - name: Run Garmin activity rescan planning tests
        run: node --experimental-default-type=module --test tests/garmin-activity-scan-plan.test.mjs

      - name: Run automatic Garmin sync cursor tests
        run: node --experimental-default-type=module --test tests/garmin-automatic-sync-plan.test.mjs tests/garmin-automatic-sync-wiring.test.mjs
      
      - name: Run Garmin activity delta and upsert planning tests
        run: node --experimental-default-type=module --test tests/garmin-activity-cloud-delta.test.mjs tests/garmin-activity-upsert-plan.test.mjs tests/garmin-activity-cloud-delta-wiring.test.mjs

      - name: Run Garmin FIT download retry tests
        run: node --experimental-default-type=module --test tests/garmin-fit-download-retry.test.mjs

      - name: Run Garmin activity pagination tests
        run: node --experimental-default-type=module --test tests/garmin-activity-pagination.test.mjs

      - name: Run Garmin sync history tests
        run: node --experimental-default-type=module --test tests/garmin-sync-history.test.mjs

      - name: Run Garmin analysis cache tests
        run: node --experimental-default-type=module --test tests/garmin-analysis-cache.test.mjs

      - name: Run Garmin heart-rate sync tests
        run: node --experimental-default-type=module --test tests/garmin-heart-rate-sync.test.mjs

      - name: Run Garmin health normalization tests
        run: node --experimental-default-type=module --test tests/garmin-health-normalize.test.mjs

      - name: Run Garmin metric provenance tests
        run: node --experimental-default-type=module --test tests/garmin-metric-access.test.mjs

      - name: Run comparable Garmin HRV series tests
        run: node --experimental-default-type=module --test tests/garmin-hrv-comparability.test.mjs

      - name: Run health metric baseline provenance tests
        run: node --experimental-default-type=module --test tests/health-metric-baseline.test.mjs

      - name: Run performance data quality tests
        run: node --experimental-default-type=module --test tests/performance-data-quality.test.mjs

      - name: Run paddling telemetry display integration tests
        run: node --experimental-default-type=module --test tests/paddling-telemetry-display.test.mjs

      - name: Run daily Garmin HR recovery tests
        run: node --experimental-default-type=module --test tests/daily-heart-rate.test.mjs

      - name: Run home activity color mode tests
        run: node --experimental-default-type=module --test tests/home-activity-colors.test.mjs

      - name: Run calendar display data tests
        run: node --experimental-default-type=module --test tests/calendar-display-data.test.mjs

      - name: Run competition date default tests
        run: node --experimental-default-type=module --test tests/competition-date-default.test.mjs

      - name: Run navigation smoke tests
        run: node tests/navigation-smoke.mjs

  deploy-cloudflare:
    needs: regression-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy KAJO to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.162.0"
          command: deploy
