name: KAJO V2 CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

jobs:
  regression-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check js/main.js && node --check js/calendar.js && node --check js/dashboard.js
      - name: Run navigation smoke tests
        run: node tests/navigation-smoke.mjs
      - name: Run regression smoke tests
        run: node tests/regression-smoke.mjs
